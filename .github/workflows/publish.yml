name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# OIDC / npm Trusted Publishing. The Particle-Academy/fancy-slides
# Trusted Publisher is configured at
# https://www.npmjs.com/package/@particle-academy/fancy-slides/access
# so this workflow needs no NPM_TOKEN — npm exchanges the GitHub OIDC
# token for a short-lived publish credential.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. A published version whose changes are
      # undocumented cannot be fixed by editing the changelog afterwards — the
      # tarball is already out, and the agent upgrading into it has no way to
      # learn what broke.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\\[?v?${VERSION}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          echo "Found changelog entry for ${VERSION}."

      # Release gate: third-party dependencies must be approved and still
      # maintained BEFORE the tarball reaches the registry. Once it is
      # published, an unapproved or abandoned dependency has already shipped
      # to everyone who upgrades -- the same reason the changelog gate sits
      # here. The allowlist is FETCHED, never vendored: one source of truth,
      # so there is no per-repo copy that can drift out of agreement with it.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        # `npm install` (not `npm ci`) — this repo lives under the fancy-ui
        # workspace, so the lockfile is at the workspace root, not here.
        # `--legacy-peer-deps` because @particle-academy/fancy-code@0.4.x
        # peers on react-fancy@^2.0.0 while we depend on react-fancy@^3.0.0.
        # The actual import surface is unaffected; this is just npm being strict.
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Publish
        # OIDC publish — needs npm 11.5+, which the runner's bundled npm
        # (10.x) doesn't satisfy. `npx -y npm@latest` fetches a fresh npm
        # for this one command.
        run: npx -y npm@11.18.0 publish --provenance --access public
