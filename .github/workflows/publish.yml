name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# OIDC / npm Trusted Publishing. The Particle-Academy/fancy-slides
# Trusted Publisher is configured at
# https://www.npmjs.com/package/@particle-academy/fancy-slides/access
# so this workflow needs no NPM_TOKEN — npm exchanges the GitHub OIDC
# token for a short-lived publish credential.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. A published version whose changes are
      # undocumented cannot be fixed by editing the changelog afterwards — the
      # tarball is already out, and the agent upgrading into it has no way to
      # learn what broke.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\\[?v?${VERSION}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          echo "Found changelog entry for ${VERSION}."


      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        # `npm install` (not `npm ci`) — this repo lives under the fancy-ui
        # workspace, so the lockfile is at the workspace root, not here.
        # `--legacy-peer-deps` because @particle-academy/fancy-code@0.4.x
        # peers on react-fancy@^2.0.0 while we depend on react-fancy@^3.0.0.
        # The actual import surface is unaffected; this is just npm being strict.
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Publish
        # OIDC publish — needs npm 11.5+, which the runner's bundled npm
        # (10.x) doesn't satisfy. `npx -y npm@latest` fetches a fresh npm
        # for this one command.
        run: npx -y npm@11.18.0 publish --provenance --access public
